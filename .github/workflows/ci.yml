name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  quality:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Cypress smoke against preview
        run: npm run smoke

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog from git history
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.generated.md

      - name: Show drift (non-blocking on branches/PRs)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          if ! diff -u CHANGELOG.md CHANGELOG.generated.md; then
            echo "::notice::CHANGELOG.md differs from git history. Before pushing a version tag, run npm run changelog and commit the update."
          else
            echo "CHANGELOG.md is up to date."
          fi

      - name: Require CHANGELOG.md up to date on version tags
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: diff -u CHANGELOG.md CHANGELOG.generated.md
